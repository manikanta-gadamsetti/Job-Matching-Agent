[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-agent"
version = "0.1.0"
description = "Semi-autonomous job sourcing, resume tailoring, and application assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "playwright>=1.44.0",
  "jinja2>=3.1.4",
  "fastapi>=0.115.0",
  "streamlit>=1.44.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "tenacity>=8.2.3",
  "twilio>=9.1.0",
]

[project.scripts]
job-agent = "job_agent.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
